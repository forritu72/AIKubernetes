apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: default
  labels:
    app: postgres
type: Opaque
stringData:
  # Local development only. Rotate this before the manifest goes anywhere near
  # a shared cluster, and move it out of git.
  POSTGRES_PASSWORD: devpassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    # A database on a ReadWriteOnce volume cannot have two pods mounting it at
    # once, which a rolling update would briefly require.
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        # Pod level only - putting fsGroup on a container makes the API server
        # reject the whole manifest. It makes the mounted volume group-writable
        # by the postgres user.
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:16.4
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        # The volume is mounted at /var/lib/postgresql/data, and initdb refuses
        # to run in a directory that is not empty. Provisioned volumes are not
        # reliably empty, so point PGDATA at a subdirectory of the mount.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          # readOnlyRootFilesystem stays on, which Postgres only tolerates
          # because the three paths it must write to are mounted as emptyDir
          # volumes above. Dropping those volumes without also dropping this
          # leaves the container failing to create its unix socket.
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
  type: ClusterIP
