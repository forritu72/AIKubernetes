apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-22-pod
  namespace: default
  labels:
    app: ubuntu22
spec:
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  restartPolicy: Always
  containers:
  - name: ubuntu
    image: ubuntu:22.04
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    readinessProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - echo ok
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - echo ok
      initialDelaySeconds: 15
      periodSeconds: 20
      failureThreshold: 3
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
