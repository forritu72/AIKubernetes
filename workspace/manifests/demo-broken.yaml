# Deliberately broken workloads, for exercising the diagnosis path.
#   kubectl apply -f workspace/manifests/demo-broken.yaml
# Three distinct failure modes: ImagePullBackOff, CrashLoopBackOff, Pending.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# 1. ImagePullBackOff - the tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo
  labels: {app: bad-image}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bad-image}
  template:
    metadata:
      labels: {app: bad-image}
    spec:
      containers:
        - name: app
          image: nginx:this-tag-does-not-exist-9999
          ports: [{containerPort: 80}]
---
# 2. CrashLoopBackOff - the container exits non-zero immediately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: demo
  labels: {app: crasher}
spec:
  replicas: 1
  selector:
    matchLabels: {app: crasher}
  template:
    metadata:
      labels: {app: crasher}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'FATAL: cannot reach database at db:5432'; sleep 2; exit 1"]
---
# 3. Pending - resource request no node can satisfy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: too-big
  namespace: demo
  labels: {app: too-big}
spec:
  replicas: 1
  selector:
    matchLabels: {app: too-big}
  template:
    metadata:
      labels: {app: too-big}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "64"
              memory: "512Gi"
