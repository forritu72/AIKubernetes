stages:
  - test
  - build
  - push
  - deploy

variables:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: test-ecr
  IMAGE_TAG: "$CI_COMMIT_SHA"

before_script:
  - apk add --no-cache python3 py3-pip docker
  - pip3 install --upgrade pip
  - pip3 install -r workspace/requirements.txt

cache:
  paths:
    - .cache/pip

test:
  stage: test
  script:
    - pytest
  only:
    - merge_requests

build:
  stage: build
  script:
    - docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
  only:
    - merge_requests

push:
  stage: push
  image: amazon/aws-cli
  script:
    - aws --version
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
    - docker tag $ECR_REPOSITORY:$IMAGE_TAG $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
    - docker push $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
    - kubectl set image deployment/fastapi-deployment fastapi-container=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
    - kubectl rollout status deployment/fastapi-deployment
  only:
    - main
  environment:
    name: production
    url: https://your-production-url.example.com
