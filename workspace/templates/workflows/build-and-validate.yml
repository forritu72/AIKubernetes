# Template: build -> push to GHCR -> validate manifests.
#
# Parameterize before committing: IMAGE_NAME, the manifest path, and the
# Dockerfile location. The pipeline-author subagent reads the repo and adapts
# this rather than copying it verbatim.
#
# Registry note: GHCR is the default because the built-in GITHUB_TOKEN can push
# to it with `packages: write` and no secret has to be created. This matters -
# this system deliberately holds no permission to manage GitHub Secrets.
# For ECR instead, swap the login step for aws-actions/amazon-ecr-login and
# assume a role via OIDC, as in deploy-eks.yml.

name: build-and-validate

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MANIFEST_DIR: manifests

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Schema-validate manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            "${MANIFEST_DIR}/"

      - name: Client-side dry run
        run: |
          for file in "${MANIFEST_DIR}"/*.yaml; do
            echo "--- $file"
            kubectl apply --dry-run=client -f "$file"
          done

  # Deploy is intentionally absent here: GitHub-hosted runners cannot reach a
  # local Docker Desktop cluster. The copilot performs the deploy locally,
  # behind an approval click. See deploy-eks.yml for the EKS path.
