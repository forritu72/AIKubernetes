# Template: cheap PR gate. Lints and dry-runs manifests, builds nothing.
name: pr-validate

on:
  pull_request:
    paths:
      - "manifests/**"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      MANIFEST_DIR: manifests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workspace/requirements.txt

      - name: Run tests
        run: |
          # Add your test command here, e.g. pytest
          pytest

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Schema-validate manifests
        run: kubeconform -strict -summary -ignore-missing-schemas "${MANIFEST_DIR}/"

      - name: Client-side dry run
        run: |
          for file in "${MANIFEST_DIR}"/*.yaml; do
            echo "--- $file"
            kubectl apply --dry-run=client -f "$file"
          done

      - name: Build Docker image
        run: |
          docker build -t fastapi-app:pr .

      - name: Docker image build check
        run: docker images fastapi-app:pr

