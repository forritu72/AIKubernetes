# Cluster profiles. This file is the AWS seam: moving to EKS is
#   aws eks update-kubeconfig --name prod
# plus uncommenting a profile below. No code change.
default: local

profiles:
  local:
    label: Docker Desktop (local)
    context: docker-desktop
    kubeconfig: ~/.kube/config
    env: {}

